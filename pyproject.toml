[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis-mcp"
version = "0.1.0"
description = "An MCP server that gives Claude full control of your Windows desktop."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "CKY" }]
keywords = ["mcp", "claude", "automation", "desktop", "windows"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "fastmcp>=0.2.0",
    "pyautogui>=0.9.54",
    "pyperclip>=1.8.2",
    "pywinauto>=0.6.8",
    "Pillow",
    "pyscreeze",
]

[project.urls]
Repository = "https://github.com/cky-gitHub/jarvis-mcp"

[project.scripts]
jarvis-mcp = "jarvis_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_mcp"]